<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vercel Joke Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000;
            color: #ededed;
            -webkit-tap-highlight-color: transparent;
        }

        /* Focus management to prevent visual glitches */
        *:focus {
            outline: none;
        }
        
        button:focus-visible, a:focus-visible, input:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #444;
        }

        .fade-transition {
            transition: opacity 0.3s ease-in-out;
        }

        .fade-out {
            opacity: 0;
        }

        .fade-in {
            opacity: 1;
        }

        @keyframes pulse-custom {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }
        .animate-pulse-custom {
            animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .toast-enter {
            transform: translateY(0);
            opacity: 1;
        }
        .toast-exit {
            transform: translateY(100%);
            opacity: 0;
        }

        .heart-filled path {
            fill: currentColor;
        }

        /* Drawer Slide Animation */
        .drawer-slide {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Modal Backdrop Fade */
        .modal-fade {
            transition: opacity 0.25s ease-out;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center relative overflow-x-hidden selection:bg-[#333] selection:text-white">

    <!-- Background Animated Dots Grid -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
        <canvas id="dots-canvas" class="w-full h-full block"></canvas>
        <div class="absolute inset-0 pointer-events-none" style="background: radial-gradient(circle at center, transparent 30%, #000 95%);"></div>
    </div>

    <!-- Top Action Navigation -->
    <header class="fixed top-0 left-0 right-0 z-20 flex justify-between items-center p-4 md:p-6 max-w-6xl mx-auto w-full">
        <div class="flex items-center gap-2 select-none">
            <svg width="20" height="20" viewBox="0 0 76 65" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-white fill-current">
                <path d="M37.5274 0L75.0548 65H0L37.5274 0Z"/>
            </svg>
            <span class="text-sm font-semibold tracking-wider uppercase text-zinc-400">Jokes.dev</span>
        </div>

        <button id="btn-open-drawer" class="flex items-center gap-2 px-3 py-1.5 bg-[#0a0a0a] border border-[#222] hover:border-[#444] rounded-full text-xs font-medium text-zinc-300 hover:text-white transition-all duration-200 active:scale-95 group">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-red-500">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            Favorites
            <span id="fav-count-badge" class="bg-[#222] text-zinc-300 px-1.5 py-0.5 rounded-full text-[10px] font-mono group-hover:bg-[#333] transition-colors">0</span>
        </button>
    </header>

    <!-- Main Interactive Card -->
    <main class="relative z-10 w-full max-w-lg p-6 mx-4 my-16">
        
        <div class="bg-[#0a0a0a] border border-[#222] hover:border-[#444] rounded-xl p-8 shadow-2xl backdrop-blur-md flex flex-col items-center text-center space-y-8 transition-all duration-500 ease-out group">
            
            <div class="space-y-3 w-full flex flex-col items-center">
                <h1 class="text-xl font-medium tracking-tight text-white flex items-center gap-2 select-none">
                    <svg width="24" height="24" viewBox="0 0 76 65" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-white fill-current">
                        <path d="M37.5274 0L75.0548 65H0L37.5274 0Z"/>
                    </svg>
                    Joke Generator
                </h1>
                
                <div class="flex flex-wrap items-center justify-center gap-3 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <p id="api-url-text" class="text-xs text-[#666] font-mono tracking-tighter select-none transition-colors duration-300">
                        v2.jokeapi.dev/joke/Any
                    </p>
                    <div class="w-px h-3 bg-[#333]"></div>
                    <label class="flex items-center cursor-pointer gap-2 group/toggle" title="Enable Family Friendly Mode">
                        <span class="text-xs text-[#888] group-hover/toggle:text-white font-medium select-none transition-colors">Safe Mode</span>
                        <div class="relative inline-flex items-center">
                            <input type="checkbox" id="family-friendly-toggle" class="sr-only">
                            <div id="toggle-bg" class="w-8 h-4 bg-[#333] rounded-full transition-colors duration-300"></div>
                            <div id="toggle-knob" class="absolute left-[2px] top-[2px] w-[12px] h-[12px] bg-[#888] rounded-full transition-all duration-300"></div>
                        </div>
                    </label>
                </div>
            </div>

            <div class="w-full h-px bg-gradient-to-r from-transparent via-[#333] to-transparent opacity-50"></div>

            <!-- Fixed height viewport to prevent layout shifting -->
            <div class="min-h-[140px] w-full flex flex-col items-center justify-center px-2 relative">
                
                <!-- Skeleton Loader -->
                <div id="skeleton-loader" class="w-full flex flex-col space-y-3 animate-pulse-custom absolute inset-0 m-auto justify-center fade-transition">
                    <div class="h-6 bg-[#222] rounded w-3/4 mx-auto"></div>
                    <div class="h-6 bg-[#222] rounded w-5/6 mx-auto"></div>
                    <div class="h-6 bg-[#222] rounded w-1/2 mx-auto"></div>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="text-red-400 text-lg font-medium absolute inset-0 m-auto flex items-center justify-center fade-transition fade-out hidden">
                    Failed to load a joke. Please try again.
                </div>

                <!-- Joke Text -->
                <p id="joke-text" class="text-xl md:text-2xl font-normal leading-relaxed tracking-tight text-[#ededed] whitespace-pre-wrap fade-transition fade-out w-full"></p>
                
            </div>

            <!-- Main Actions Toolbar -->
            <div id="action-toolbar" class="flex items-center justify-center gap-3 w-full transition-opacity duration-300 opacity-50 pointer-events-none">
                <button id="btn-favorite" class="p-3 bg-[#111] border border-[#222] rounded-full hover:bg-[#1a1a1a] hover:border-[#444] transition-all duration-200 active:scale-95 text-[#888] hover:text-white" title="Favorite">
                    <svg id="icon-heart" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-all duration-300">
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                    </svg>
                </button>
                <button id="btn-export-card" class="p-3 bg-[#111] border border-[#222] rounded-full hover:bg-[#1a1a1a] hover:border-[#444] transition-all duration-200 active:scale-95 text-[#888] hover:text-white" title="Export Vercel Social Card">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </button>
                <button id="btn-download" class="p-3 bg-[#111] border border-[#222] rounded-full hover:bg-[#1a1a1a] hover:border-[#444] transition-all duration-200 active:scale-95 text-[#888] hover:text-white" title="Download Text">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
                <button id="btn-share" class="p-3 bg-[#111] border border-[#222] rounded-full hover:bg-[#1a1a1a] hover:border-[#444] transition-all duration-200 active:scale-95 text-[#888] hover:text-white" title="Share">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
            </div>

            <!-- Primary Generate Button -->
            <button id="btn-generate" class="w-full bg-white text-black hover:bg-[#e0e0e0] transition-all duration-300 font-medium py-3 px-6 rounded-lg shadow-[0_0_20px_rgba(255,255,255,0.05)] hover:shadow-[0_0_25px_rgba(255,255,255,0.15)] active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 group">
                <span id="btn-text-loading" class="flex items-center gap-2">
                    <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-black" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    Deploying...
                </span>
                <span id="btn-text-default" class="hidden items-center gap-2">
                    Generate New Joke
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform group-hover:translate-x-1">
                        <path d="M21 2v6h-6"></path>
                        <path d="M21 13a9 9 0 1 1-3-7.7L21 8"></path>
                    </svg>
                </span>
            </button>

        </div>
    </main>

    <!-- Favorites Drawer Overlay & Sidebar -->
    <div id="drawer-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-40 modal-fade opacity-0 pointer-events-none"></div>
    <aside id="drawer" class="fixed top-0 right-0 bottom-0 w-full max-w-md bg-[#0a0a0a] border-l border-[#222] z-50 drawer-slide translate-x-full flex flex-col shadow-2xl">
        <!-- Drawer Header -->
        <div class="p-6 border-b border-[#222] flex items-center justify-between">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" class="text-red-500">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <h2 class="text-lg font-medium text-white">Saved Favorites</h2>
            </div>
            <button id="btn-close-drawer" class="p-2 text-zinc-400 hover:text-white hover:bg-[#1a1a1a] rounded-lg transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Drawer Search & Controls -->
        <div class="p-4 border-b border-[#1a1a1a] flex gap-2">
            <div class="relative flex-1">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input id="drawer-search" type="text" placeholder="Search saved jokes..." class="w-full bg-[#111] border border-[#222] focus:border-[#444] rounded-lg pl-9 pr-3 py-2 text-xs text-white placeholder-zinc-500 transition-colors">
            </div>
            <button id="btn-clear-favorites" class="px-3 py-2 text-xs font-medium text-red-400 hover:text-red-300 hover:bg-red-950/30 rounded-lg transition-colors border border-transparent hover:border-red-900/40">
                Clear
            </button>
        </div>

        <!-- Favorites List -->
        <div id="drawer-fav-list" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Dynamic favorites cards will render here -->
        </div>
    </aside>

    <!-- Export Vercel Card Modal -->
    <div id="card-modal-backdrop" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 modal-fade opacity-0 pointer-events-none flex items-center justify-center p-4">
        <div class="bg-[#0a0a0a] border border-[#222] rounded-xl max-w-2xl w-full p-6 shadow-2xl flex flex-col space-y-6 relative overflow-hidden">
            <div class="flex items-center justify-between border-b border-[#222] pb-4">
                <div class="flex items-center gap-2">
                    <svg width="20" height="20" viewBox="0 0 76 65" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-white fill-current">
                        <path d="M37.5274 0L75.0548 65H0L37.5274 0Z"/>
                    </svg>
                    <h3 class="text-base font-medium text-white">Vercel OG Social Card</h3>
                </div>
                <button id="btn-close-card-modal" class="p-1 text-zinc-400 hover:text-white hover:bg-[#1a1a1a] rounded-lg transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Canvas Card Preview Container -->
            <div class="w-full flex justify-center items-center bg-[#000] border border-[#222] rounded-lg p-2 overflow-hidden shadow-inner">
                <canvas id="social-card-canvas" width="1200" height="630" class="w-full h-auto rounded max-h-[380px] object-contain"></canvas>
            </div>

            <!-- Export Actions -->
            <div class="flex items-center justify-end gap-3 pt-2">
                <button id="btn-cancel-card" class="px-4 py-2 bg-[#111] hover:bg-[#1a1a1a] border border-[#222] text-xs font-medium text-zinc-300 rounded-lg transition-colors">
                    Cancel
                </button>
                <button id="btn-download-social-card" class="px-5 py-2 bg-white hover:bg-[#e0e0e0] text-black text-xs font-medium rounded-lg shadow-lg flex items-center gap-2 transition-all active:scale-95">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download High-Res PNG
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-4 py-2 bg-[#222] border border-[#333] rounded-full shadow-lg text-sm transition-all duration-300 ease-in-out z-50 toast-exit">
        <!-- Toast message goes here -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentJoke = { id: null, text: '' };
            let favorites = [];
            let isLoading = true;
            let toastTimeout = null;
            let isFamilyFriendly = false;
            let activeCardJokeText = '';

            // DOM References
            const skeletonLoader = document.getElementById('skeleton-loader');
            const jokeTextEl = document.getElementById('joke-text');
            const errorEl = document.getElementById('error-message');
            const actionToolbar = document.getElementById('action-toolbar');
            
            const btnGenerate = document.getElementById('btn-generate');
            const btnTextLoading = document.getElementById('btn-text-loading');
            const btnTextDefault = document.getElementById('btn-text-default');
            
            const btnFavorite = document.getElementById('btn-favorite');
            const iconHeart = document.getElementById('icon-heart');
            const btnExportCard = document.getElementById('btn-export-card');
            const btnDownload = document.getElementById('btn-download');
            const btnShare = document.getElementById('btn-share');
            
            const toast = document.getElementById('toast');
            const toggleInput = document.getElementById('family-friendly-toggle');
            const toggleBg = document.getElementById('toggle-bg');
            const toggleKnob = document.getElementById('toggle-knob');
            const apiUrlText = document.getElementById('api-url-text');

            // Drawer References
            const btnOpenDrawer = document.getElementById('btn-open-drawer');
            const btnCloseDrawer = document.getElementById('btn-close-drawer');
            const drawerBackdrop = document.getElementById('drawer-backdrop');
            const drawer = document.getElementById('drawer');
            const favCountBadge = document.getElementById('fav-count-badge');
            const drawerFavList = document.getElementById('drawer-fav-list');
            const drawerSearch = document.getElementById('drawer-search');
            const btnClearFavorites = document.getElementById('btn-clear-favorites');

            // Social Card Modal References
            const cardModalBackdrop = document.getElementById('card-modal-backdrop');
            const btnCloseCardModal = document.getElementById('btn-close-card-modal');
            const btnCancelCard = document.getElementById('btn-cancel-card');
            const btnDownloadSocialCard = document.getElementById('btn-download-social-card');
            const socialCardCanvas = document.getElementById('social-card-canvas');

            const canvas = document.getElementById('dots-canvas');
            const ctx = canvas.getContext('2d');
            let dots = [];
            const spacing = 28;
            const dotRadius = 1.75;
            const baseOpacity = 0.25;

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                initDots();
            }

            function initDots() {
                dots = [];
                const cols = Math.ceil(canvas.width / spacing) + 1;
                const rows = Math.ceil(canvas.height / spacing) + 1;

                for (let i = 0; i < cols; i++) {
                    for (let j = 0; j < rows; j++) {
                        dots.push({
                            x: i * spacing,
                            y: j * spacing,
                            opacity: baseOpacity,
                            targetOpacity: baseOpacity,
                            speed: 0.01 + Math.random() * 0.02
                        });
                    }
                }
            }

            function animateDots() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (dots.length > 0 && Math.random() < 0.35) {
                    const randomIndex = Math.floor(Math.random() * dots.length);
                    const dot = dots[randomIndex];
                    if (dot.targetOpacity === baseOpacity) {
                        dot.targetOpacity = 0.75 + Math.random() * 0.25;
                        dot.speed = 0.02 + Math.random() * 0.03;
                    }
                }

                for (let i = 0; i < dots.length; i++) {
                    const dot = dots[i];

                    if (Math.abs(dot.opacity - dot.targetOpacity) < 0.01) {
                        if (dot.targetOpacity > baseOpacity) {
                            dot.targetOpacity = baseOpacity;
                            dot.speed = 0.01 + Math.random() * 0.02;
                        }
                    } else {
                        if (dot.opacity < dot.targetOpacity) {
                            dot.opacity += dot.speed;
                        } else {
                            dot.opacity -= dot.speed;
                        }
                    }

                    ctx.beginPath();
                    ctx.arc(dot.x, dot.y, dotRadius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, Math.min(1, dot.opacity))})`;
                    ctx.fill();

                    if (dot.opacity > 0.45) {
                        ctx.beginPath();
                        ctx.arc(dot.x, dot.y, dotRadius * 4, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(255, 255, 255, ${(dot.opacity - 0.45) * 0.4})`;
                        ctx.fill();
                    }
                }

                requestAnimationFrame(animateDots);
            }

            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            requestAnimationFrame(animateDots);

            try {
                const savedFavs = localStorage.getItem('vercel-jokes-favs-html');
                if (savedFavs) {
                    favorites = JSON.parse(savedFavs);
                }
            } catch (e) {
                console.error("Could not parse saved favorites");
            }

            updateFavoriteBadge();
            fetchJoke();

            function updateUIState(state) {
                isLoading = state === 'loading';
                btnGenerate.disabled = isLoading;
                if (isLoading) {
                    btnTextLoading.classList.remove('hidden');
                    btnTextLoading.classList.add('flex');
                    btnTextDefault.classList.add('hidden');
                    btnTextDefault.classList.remove('flex');
                    
                    actionToolbar.classList.add('opacity-50', 'pointer-events-none');
                    actionToolbar.classList.remove('opacity-100');
                } else {
                    btnTextLoading.classList.add('hidden');
                    btnTextLoading.classList.remove('flex');
                    btnTextDefault.classList.remove('hidden');
                    btnTextDefault.classList.add('flex');
                    
                    actionToolbar.classList.remove('opacity-50', 'pointer-events-none');
                    actionToolbar.classList.add('opacity-100');
                }
            }

            function showToast(message) {
                toast.textContent = message;
                toast.classList.remove('toast-exit');
                toast.classList.add('toast-enter');
                
                if (toastTimeout) clearTimeout(toastTimeout);
                
                toastTimeout = setTimeout(() => {
                    toast.classList.remove('toast-enter');
                    toast.classList.add('toast-exit');
                }, 3000);
            }

            function updateFavoriteIcon() {
                const isFav = favorites.some(fav => fav.id === currentJoke.id);
                if (isFav) {
                    iconHeart.classList.add('text-red-500', 'scale-110', 'heart-filled');
                    iconHeart.parentElement.classList.remove('text-[#888]', 'hover:text-white');
                } else {
                    iconHeart.classList.remove('text-red-500', 'scale-110', 'heart-filled');
                    iconHeart.parentElement.classList.add('text-[#888]', 'hover:text-white');
                }
            }

            function updateFavoriteBadge() {
                favCountBadge.textContent = favorites.length;
            }

            function saveFavorites() {
                localStorage.setItem('vercel-jokes-favs-html', JSON.stringify(favorites));
                updateFavoriteBadge();
                renderFavoritesList();
            }

            async function fetchJoke() {
                if (isLoading && currentJoke.text !== '') return;
                
                jokeTextEl.classList.add('fade-out');
                jokeTextEl.classList.remove('fade-in');
                errorEl.classList.add('fade-out');
                
                updateUIState('loading');

                setTimeout(async () => {
                    jokeTextEl.classList.add('hidden');
                    skeletonLoader.classList.remove('hidden', 'fade-out');
                    skeletonLoader.classList.add('fade-in');

                    try {
                        const baseUrl = 'https://v2.jokeapi.dev/joke/Any';
                        const safeFlags = '?blacklistFlags=nsfw,religious,political,racist,sexist,explicit';
                        const fetchUrl = isFamilyFriendly ? baseUrl + safeFlags : baseUrl;
                        
                        const response = await fetch(fetchUrl);
                        const data = await response.json();
                        
                        if (data.error) {
                            throw new Error(data.message || 'Failed to fetch joke');
                        }

                        currentJoke.id = data.id;
                        currentJoke.text = data.type === 'twopart' 
                            ? `${data.setup}\n\n${data.delivery}` 
                            : data.joke;

                        jokeTextEl.textContent = currentJoke.text;
                        updateFavoriteIcon();
                        
                        skeletonLoader.classList.add('fade-out');
                        skeletonLoader.classList.remove('fade-in');

                        setTimeout(() => {
                            skeletonLoader.classList.add('hidden');
                            jokeTextEl.classList.remove('hidden', 'fade-out');
                            void jokeTextEl.offsetWidth; 
                            jokeTextEl.classList.add('fade-in');
                            updateUIState('idle');
                        }, 300);

                    } catch (err) {
                        console.error('Error fetching joke:', err);
                        
                        skeletonLoader.classList.add('fade-out');
                        skeletonLoader.classList.remove('fade-in');
                        
                        setTimeout(() => {
                            skeletonLoader.classList.add('hidden');
                            errorEl.classList.remove('hidden', 'fade-out');
                            void errorEl.offsetWidth;
                            errorEl.classList.add('fade-in');
                            updateUIState('idle');
                        }, 300);
                    }
                }, 300);
            }

            function openDrawer() {
                renderFavoritesList();
                drawerBackdrop.classList.remove('opacity-0', 'pointer-events-none');
                drawerBackdrop.classList.add('opacity-100');
                drawer.classList.remove('translate-x-full');
                drawer.classList.add('translate-x-0');
            }

            function closeDrawer() {
                drawer.classList.remove('translate-x-0');
                drawer.classList.add('translate-x-full');
                drawerBackdrop.classList.remove('opacity-100');
                drawerBackdrop.classList.add('opacity-0', 'pointer-events-none');
            }

            function renderFavoritesList() {
                const query = drawerSearch.value.toLowerCase().trim();
                const filtered = favorites.filter(fav => fav.text.toLowerCase().includes(query));

                if (filtered.length === 0) {
                    drawerFavList.innerHTML = `
                        <div class="h-64 flex flex-col items-center justify-center text-center p-6 space-y-3">
                            <div class="p-3 bg-[#111] border border-[#222] rounded-full text-zinc-600">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                </svg>
                            </div>
                            <p class="text-xs text-zinc-500 font-medium">
                                ${query ? 'No matching jokes found.' : 'No saved favorites yet.'}
                            </p>
                        </div>
                    `;
                    return;
                }

                drawerFavList.innerHTML = filtered.map(fav => `
                    <div class="bg-[#111] border border-[#222] hover:border-[#333] rounded-lg p-4 space-y-3 transition-colors group">
                        <p class="text-xs leading-relaxed text-zinc-200 whitespace-pre-wrap font-sans">${escapeHtml(fav.text)}</p>
                        <div class="flex items-center justify-between pt-2 border-t border-[#1a1a1a]">
                            <span class="text-[10px] font-mono text-zinc-600">ID: #${fav.id || 'N/A'}</span>
                            <div class="flex items-center gap-1">
                                <button onclick="window.copyFavJoke('${escapeJsString(fav.text)}')" class="p-1.5 text-zinc-400 hover:text-white hover:bg-[#222] rounded transition-colors" title="Copy Text">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                                </button>
                                <button onclick="window.exportFavSocialCard('${escapeJsString(fav.text)}')" class="p-1.5 text-zinc-400 hover:text-white hover:bg-[#222] rounded transition-colors" title="Export Social Card">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                                </button>
                                <button onclick="window.removeFavorite(${fav.id})" class="p-1.5 text-red-400 hover:text-red-300 hover:bg-red-950/40 rounded transition-colors" title="Remove">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            function escapeHtml(str) {
                return str.replace(/[&<>"']/g, function(m) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
                });
            }

            function escapeJsString(str) {
                return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n');
            }

            // Expose drawer helper methods globally for inline onclick handlers
            window.removeFavorite = function(id) {
                favorites = favorites.filter(f => f.id !== id);
                saveFavorites();
                updateFavoriteIcon();
                showToast('Removed from favorites');
            };

            window.copyFavJoke = async function(text) {
                try {
                    await navigator.clipboard.writeText(text);
                } catch(e) {
                    const t = document.createElement("textarea");
                    t.value = text;
                    document.body.appendChild(t);
                    t.select();
                    document.execCommand("copy");
                    t.remove();
                }
                showToast('Copied to clipboard');
            };

            window.exportFavSocialCard = function(text) {
                openCardModal(text);
            };

            function openCardModal(textToRender) {
                activeCardJokeText = textToRender || currentJoke.text;
                if (!activeCardJokeText) return;

                renderVercelSocialCard(activeCardJokeText);

                cardModalBackdrop.classList.remove('opacity-0', 'pointer-events-none');
                cardModalBackdrop.classList.add('opacity-100');
            }

            function closeCardModal() {
                cardModalBackdrop.classList.remove('opacity-100');
                cardModalBackdrop.classList.add('opacity-0', 'pointer-events-none');
            }

            function renderVercelSocialCard(jokeText) {
                const cCtx = socialCardCanvas.getContext('2d');
                const width = 1200;
                const height = 630;

                // Canvas dimensions
                socialCardCanvas.width = width;
                socialCardCanvas.height = height;

                // Background
                cCtx.fillStyle = '#000000';
                cCtx.fillRect(0, 0, width, height);

                // Grid lines background
                cCtx.strokeStyle = 'rgba(255, 255, 255, 0.07)';
                cCtx.lineWidth = 1;
                const gridSize = 40;
                for (let x = 0; x < width; x += gridSize) {
                    cCtx.beginPath();
                    cCtx.moveTo(x, 0);
                    cCtx.lineTo(x, height);
                    cCtx.stroke();
                }
                for (let y = 0; y < height; y += gridSize) {
                    cCtx.beginPath();
                    cCtx.moveTo(0, y);
                    cCtx.lineTo(width, y);
                    cCtx.stroke();
                }

                // Vignette radial gradient
                const vignette = cCtx.createRadialGradient(width/2, height/2, 100, width/2, height/2, 600);
                vignette.addColorStop(0, 'rgba(0, 0, 0, 0)');
                vignette.addColorStop(1, 'rgba(0, 0, 0, 0.85)');
                cCtx.fillStyle = vignette;
                cCtx.fillRect(0, 0, width, height);

                // Outer Glow / Border Frame
                cCtx.strokeStyle = '#222222';
                cCtx.lineWidth = 8;
                cCtx.strokeRect(20, 20, width - 40, height - 40);

                // Header Badge - Vercel Triangle Logo
                cCtx.fillStyle = '#ffffff';
                cCtx.beginPath();
                cCtx.moveTo(80, 80);
                cCtx.lineTo(112, 135);
                cCtx.lineTo(48, 135);
                cCtx.closePath();
                cCtx.fill();

                // Brand Title Text
                cCtx.font = '600 28px Inter, sans-serif';
                cCtx.fillStyle = '#ffffff';
                cCtx.fillText('JOKES.DEV', 132, 118);

                // Top Right Pill Tag
                cCtx.fillStyle = '#111111';
                cCtx.strokeStyle = '#333333';
                cCtx.lineWidth = 2;
                roundRect(cCtx, width - 240, 80, 160, 42, 21, true, true);
                
                cCtx.font = '500 16px Inter, sans-serif';
                cCtx.fillStyle = '#888888';
                cCtx.fillText('VERCEL OG', width - 210, 107);

                // Divider Line
                cCtx.strokeStyle = '#222222';
                cCtx.lineWidth = 2;
                cCtx.beginPath();
                cCtx.moveTo(80, 170);
                cCtx.lineTo(width - 80, 170);
                cCtx.stroke();

                // Main Text Rendering (Wrapped)
                cCtx.font = '400 38px Inter, sans-serif';
                cCtx.fillStyle = '#ededed';

                const maxLineWidth = width - 200;
                const lineHeight = 56;
                const startY = 260;

                // Handle paragraphs (\n\n)
                const paragraphs = jokeText.split('\n\n');
                let lines = [];

                paragraphs.forEach((p, pIndex) => {
                    const words = p.split(' ');
                    let currentLine = '';

                    words.forEach(word => {
                        const testLine = currentLine ? currentLine + ' ' + word : word;
                        const metrics = cCtx.measureText(testLine);
                        if (metrics.width > maxLineWidth) {
                            lines.push(currentLine);
                            currentLine = word;
                        } else {
                            currentLine = testLine;
                        }
                    });
                    if (currentLine) lines.push(currentLine);
                    if (pIndex < paragraphs.length - 1) lines.push(''); // Spacer line
                });

                // Calculate vertical centering
                const totalTextHeight = lines.length * lineHeight;
                let currentY = startY;
                if (totalTextHeight < 200) {
                    currentY = 250 + (200 - totalTextHeight) / 3;
                }

                lines.forEach(line => {
                    if (line) {
                        cCtx.fillText(line, 80, currentY);
                    }
                    currentY += lineHeight;
                });

                // Footer Section
                cCtx.font = '400 18px Inter, sans-serif';
                cCtx.fillStyle = '#666666';
                cCtx.fillText('Generated via v2.jokeapi.dev', 80, height - 70);

                cCtx.fillStyle = '#ffffff';
                cCtx.fillText('vercel.com', width - 180, height - 70);
            }

            function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
                if (fill) ctx.fill();
                if (stroke) ctx.stroke();
            }

            function downloadSocialCardPNG() {
                const link = document.createElement('a');
                link.download = `vercel-joke-card-${Date.now()}.png`;
                link.href = socialCardCanvas.toDataURL('image/png');
                link.click();
                showToast('Social Card PNG downloaded');
            }


            toggleInput.addEventListener('change', (e) => {
                isFamilyFriendly = e.target.checked;
                
                if (isFamilyFriendly) {
                    toggleBg.classList.remove('bg-[#333]');
                    toggleBg.classList.add('bg-white');
                    toggleKnob.classList.remove('bg-[#888]');
                    toggleKnob.classList.add('bg-black', 'translate-x-4');
                    apiUrlText.textContent = '.../Any?blacklistFlags=nsfw...';
                } else {
                    toggleBg.classList.remove('bg-white');
                    toggleBg.classList.add('bg-[#333]');
                    toggleKnob.classList.remove('bg-black', 'translate-x-4');
                    toggleKnob.classList.add('bg-[#888]');
                    apiUrlText.textContent = 'v2.jokeapi.dev/joke/Any';
                }
                
                showToast(isFamilyFriendly ? 'Safe Mode enabled' : 'Safe Mode disabled');
                if (!isLoading) fetchJoke();
            });

            btnGenerate.addEventListener('click', fetchJoke);

            btnFavorite.addEventListener('click', () => {
                if (!currentJoke.id) return;
                
                const index = favorites.findIndex(fav => fav.id === currentJoke.id);
                if (index > -1) {
                    favorites.splice(index, 1);
                    showToast('Removed from favorites');
                } else {
                    favorites.push({ ...currentJoke });
                    showToast('Added to favorites');
                }
                saveFavorites();
                updateFavoriteIcon();
            });

            btnExportCard.addEventListener('click', () => openCardModal(currentJoke.text));
            btnDownload.addEventListener('click', () => {
                if (!currentJoke.text) return;
                const blob = new Blob([currentJoke.text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `joke-${currentJoke.id || 'funny'}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Joke downloaded');
            });

            btnShare.addEventListener('click', async () => {
                if (!currentJoke.text) return;
                try {
                    if (navigator.share) {
                        await navigator.share({ title: 'A joke for you', text: currentJoke.text, url: window.location.href });
                        showToast('Shared successfully');
                    } else {
                        await window.copyFavJoke(currentJoke.text);
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') showToast('Failed to share');
                }
            });

            // Drawer triggers
            btnOpenDrawer.addEventListener('click', openDrawer);
            btnCloseDrawer.addEventListener('click', closeDrawer);
            drawerBackdrop.addEventListener('click', closeDrawer);
            drawerSearch.addEventListener('input', renderFavoritesList);

            btnClearFavorites.addEventListener('click', () => {
                if (favorites.length === 0) return;
                favorites = [];
                saveFavorites();
                updateFavoriteIcon();
                showToast('All favorites cleared');
            });

            // Modal triggers
            btnCloseCardModal.addEventListener('click', closeCardModal);
            btnCancelCard.addEventListener('click', closeCardModal);
            cardModalBackdrop.addEventListener('click', (e) => {
                if (e.target === cardModalBackdrop) closeCardModal();
            });
            btnDownloadSocialCard.addEventListener('click', downloadSocialCardPNG);

            // Global Keyboard Shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeDrawer();
                    closeCardModal();
                }
            });
        });
    </script>
</body>
</html>
