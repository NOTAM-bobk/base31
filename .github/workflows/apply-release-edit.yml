# One-off release edit for the "No-code AI tools" release (1.38.0).
#
# It runs scripts/apply-release-edit.mjs, which restores three files the
# previous commit emptied and applies the release's edits, then checks the
# result and pushes it. The push uses GITHUB_TOKEN, and GitHub does not start
# workflow runs for those, so this cannot loop. This file and the script are
# deleted again once the edit is on main.
name: Apply the no-code AI tools release edit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-release-edit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Apply the release edit
        run: node scripts/apply-release-edit.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate content, tests and types
        run: |
          npm run validate:content
          npm run test:directory
          npm run typecheck

      - name: Commit and push
        run: |
          git config user.name "base31 release bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -F - <<'MSG'
          Add a No-code AI tools section, quieter About links, and AI-crawler SEO

          - A new "No-code AI tools" strip: twelve AI builders with their own config
            file, category chips, detail pages, sitemap entries and SoftwareApplication
            ItemList schema.
          - The submit-a-URL box drops the "good finds deserve company" eyebrow and the
            arrow badge above the heading.
          - About Us and Our Story become a slim, flat pair of links under the prose.
          - SEO and AI SEO: robots.txt names the answer-engine crawlers, /llms.txt maps
            the site for assistants, and the schema gains a sitelinks SearchAction.
          - Restores components/home-page.tsx, app/late.css and app/overrides.css, which
            commit 1d09889 emptied, and bumps the release to 1.38.0.
          MSG
          git push origin HEAD:main
