<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microlink Screenshot Capture</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fafafa; /* Vercel light mode background */
            color: #111;
        }
        
        .vercel-card {
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 8px;
            box-shadow: 0 4px 14px 0 rgba(0,0,0,0.05);
            transition: box-shadow 0.2s ease;
        }

        .vercel-input {
            border: 1px solid #eaeaea;
            border-radius: 6px;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            outline: none;
        }

        .vercel-input:focus {
            border-color: #000;
            box-shadow: 0 0 0 1px #000;
        }
        
        .vercel-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .vercel-button {
            background-color: #000;
            color: #fff;
            border: 1px solid #000;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .vercel-button:hover {
            background-color: #fff;
            color: #000;
        }
        
        .vercel-button:active {
            transform: scale(0.97);
        }

        .vercel-button:disabled {
            background-color: #fafafa;
            color: #888;
            border-color: #eaeaea;
            cursor: not-allowed;
        }

        /* Loading spinner animation */
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #000;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Image load transition */
        #result-image {
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        
        #result-image.loaded {
            opacity: 1;
        }
        
        /* Modern Dot Background */
        .bg-dots {
            background-color: #fafafa;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="bg-dots min-h-screen flex flex-col items-center py-16 px-4 sm:px-6 lg:px-8">

    <main class="w-full max-w-3xl space-y-10">
        
        <!-- Header Section -->
        <div class="text-center space-y-4">
            <div class="flex justify-center mb-6">
               <!-- Simple Triangle Logo akin to Vercel -->
                <svg width="44" height="44" viewBox="0 0 76 65" fill="none" xmlns="http://www.w3.org/2000/svg" class="drop-shadow-sm">
                    <path d="M37.5274 0L75.0548 65H0L37.5274 0Z" fill="#000000"/>
                </svg>
            </div>
            <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-500 pb-1">Capture Screenshot</h1>
            <p class="text-gray-500 text-base max-w-md mx-auto">Enter any URL to generate a high-quality screenshot using the Microlink API.</p>
        </div>

        <!-- Input Form Section -->
        <div class="vercel-card p-6 sm:p-8">
            <form id="capture-form" class="flex flex-col sm:flex-row gap-4">
                <div class="flex-grow relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </div>
                    <input 
                        type="url" 
                        id="url-input" 
                        required
                        placeholder="https://example.com" 
                        class="vercel-input w-full pl-10 pr-4 py-2.5 text-sm"
                        autocomplete="off"
                    >
                </div>
                <button 
                    type="submit" 
                    id="submit-btn"
                    class="vercel-button px-6 py-2.5 text-sm sm:w-auto w-full flex justify-center items-center h-[42px]"
                >
                    <span id="btn-text">Capture</span>
                    <div id="btn-spinner" class="spinner hidden ml-2 w-4 h-4 border-2 border-t-white border-white/20"></div>
                </button>
            </form>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="hidden space-y-4">
            <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Result</h2>
            
            <!-- Error Message Box -->
            <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-600 rounded-md p-4 text-sm">
                Failed to fetch screenshot. Please check the URL and try again.
            </div>

            <!-- Image Display -->
            <div id="image-wrapper" class="vercel-card overflow-hidden relative min-h-[200px] flex items-center justify-center bg-gray-50 hidden">
                
                <!-- Loading State inside wrapper -->
                <div id="image-loading" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10">
                    <div class="spinner mb-3"></div>
                    <span class="text-xs text-gray-500 font-medium">Generating image...</span>
                </div>

                <img 
                    id="result-image" 
                    src="" 
                    alt="Captured Screenshot" 
                    class="w-full h-auto object-cover"
                >
            </div>

            <!-- Meta Info (Size, Link) -->
            <div id="meta-info" class="hidden flex flex-wrap items-center justify-between text-xs text-gray-500 px-3 py-3 bg-white border border-gray-200 rounded-lg shadow-sm mt-4">
                <div class="flex items-center gap-3">
                    <span id="image-size" class="font-mono bg-gray-100 px-2 py-1 rounded text-gray-700">0 x 0</span>
                </div>
                <div class="flex items-center gap-4 mt-2 sm:mt-0">
                    <button id="copy-btn" type="button" class="text-gray-500 hover:text-black transition-colors flex items-center gap-1.5 font-medium">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        Copy URL
                    </button>
                    <a id="download-link" href="#" target="_blank" rel="noopener noreferrer" class="text-black font-semibold hover:underline flex items-center gap-1.5">
                        Open Original
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    </a>
                </div>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('capture-form');
            const input = document.getElementById('url-input');
            const submitBtn = document.getElementById('submit-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            
            const resultContainer = document.getElementById('result-container');
            const errorMessage = document.getElementById('error-message');
            const imageWrapper = document.getElementById('image-wrapper');
            const resultImage = document.getElementById('result-image');
            const imageLoading = document.getElementById('image-loading');
            const metaInfo = document.getElementById('meta-info');
            const imageSize = document.getElementById('image-size');
            const downloadLink = document.getElementById('download-link');
            const copyBtn = document.getElementById('copy-btn');
            
            // Format URL to ensure it has a valid protocol
            const formatUrl = (urlStr) => {
                let formatted = urlStr.trim();
                if (!formatted) return '';
                if (!/^https?:\/\//i.test(formatted)) {
                    formatted = 'https://' + formatted;
                }
                return formatted;
            };

            // Auto-format visually on blur
            input.addEventListener('blur', () => {
                if (input.value) {
                    input.value = formatUrl(input.value);
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                let targetUrl = formatUrl(input.value);
                if (!targetUrl) return;
                
                input.value = targetUrl; // update input visual immediately

                // Basic validation check before sending
                try {
                    new URL(targetUrl);
                } catch(err) {
                    showError("Please enter a valid URL.");
                    return;
                }

                // UI Loading State (Button)
                setLoadingState(true);

                // Reset Result Area
                resultContainer.classList.remove('hidden');
                errorMessage.classList.add('hidden');
                imageWrapper.classList.remove('hidden');
                metaInfo.classList.add('hidden');
                
                // Show loader over image area, hide previous image
                imageLoading.classList.remove('hidden');
                resultImage.classList.remove('loaded');
                resultImage.src = '';

                // Construct direct image URLs (using embed=screenshot.url bypasses JSON CORS issues)
                const primaryUrl = `https://api.microlink.io?url=${encodeURIComponent(targetUrl)}&screenshot=true&meta=false&embed=screenshot.url`;
                const fallbackUrl = `https://image.thum.io/get/width/1200/crop/800/${targetUrl}`;

                const img = new Image();
                let fallbackAttempted = false;
                
                img.onload = () => {
                    // Hide loading overlay
                    imageLoading.classList.add('hidden');
                    
                    // Set actual image source and show it
                    resultImage.src = img.src;
                    
                    // Add slight delay for CSS transition to kick in
                    setTimeout(() => {
                        resultImage.classList.add('loaded');
                    }, 50);

                    // Update Meta Info using natural image dimensions
                    imageSize.textContent = `Dimensions: ${img.naturalWidth} × ${img.naturalHeight}`;
                    downloadLink.href = img.src;
                    
                    // Setup Copy Button Logic
                    copyBtn.onclick = () => {
                        // Try modern clipboard API, fallback to execCommand
                        const doCopy = () => {
                            try {
                                const textArea = document.createElement("textarea");
                                textArea.value = img.src;
                                document.body.appendChild(textArea);
                                textArea.select();
                                document.execCommand('copy');
                                document.body.removeChild(textArea);
                                return Promise.resolve();
                            } catch (err) {
                                return Promise.reject(err);
                            }
                        };
                        
                        const action = navigator.clipboard && navigator.clipboard.writeText 
                            ? navigator.clipboard.writeText(img.src).catch(doCopy) 
                            : doCopy();

                        action.then(() => {
                            const originalHTML = copyBtn.innerHTML;
                            copyBtn.innerHTML = `<svg class="w-4 h-4 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> <span class="text-green-600">Copied!</span>`;
                            setTimeout(() => copyBtn.innerHTML = originalHTML, 2000);
                        }).catch(err => console.error('Unable to copy', err));
                    };

                    metaInfo.classList.remove('hidden');
                    metaInfo.classList.add('flex');
                    
                    // Reset Button State
                    setLoadingState(false);
                };
                
                img.onerror = () => {
                    // If primary fails, try fallback, if fallback fails, show error
                    if (!fallbackAttempted) {
                        fallbackAttempted = true;
                        img.src = fallbackUrl;
                    } else {
                        console.error("Error loading screenshot image.");
                        showError("Failed to fetch screenshot. Please check the URL and try again.");
                        setLoadingState(false);
                    }
                };
                
                // Start loading the image (starts with primary)
                img.src = primaryUrl;
            });

            function showError(message) {
                errorMessage.textContent = message;
                imageWrapper.classList.add('hidden');
                errorMessage.classList.remove('hidden');
                imageLoading.classList.add('hidden');
                metaInfo.classList.add('hidden');
            }

            function setLoadingState(isLoading) {
                if (isLoading) {
                    submitBtn.disabled = true;
                    btnText.textContent = 'Capturing';
                    btnSpinner.classList.remove('hidden');
                    
                    // Adjust spinner color for disabled state
                    btnSpinner.classList.remove('border-t-white', 'border-white/20');
                    btnSpinner.classList.add('border-t-black', 'border-black/20');
                } else {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Capture';
                    btnSpinner.classList.add('hidden');
                    
                    // Reset spinner color
                    btnSpinner.classList.add('border-t-white', 'border-white/20');
                    btnSpinner.classList.remove('border-t-black', 'border-black/20');
                }
            }
        });
    </script>
</body>
</html>
